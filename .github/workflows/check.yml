name: Check

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # 3.9 is not available on ubuntu-latest (26.04); 3.13 matches the LCG_109 view
      - name: Validate skills, agents, manifests and generated files
        run: python scripts/marketplace.py check
      - name: Physics checks on committed validation results
        run: |
          for c in $(find validation -name check_results.py | sort); do
            echo "== $c"; python "$c" "$(dirname "$c")" || exit 1
          done
      - name: pre-commit
        uses: pre-commit/action@v3.0.1
